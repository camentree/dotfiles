<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>TITLE</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      img,
      svg {
        max-width: 100%;
      }

      :root {
        --paper: #f6f9f8;
        --surface: #ffffff;
        --ink: #16211f;
        --muted: #5c6b68;
        --accent: #0d7a70;
        --accent-soft: #0d7a7014;
        --rule: #dde6e4;
        --warn: #9a6413;
        --warn-soft: #9a641314;
        --code-bg: #eef3f2;
        --kw: #8a4b8f;
        --str: #0d6b52;
        --com: #7d8d8a;
        --display:
          "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
          serif;
        --body:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        --mono:
          ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: #0e1513;
          --surface: #151f1d;
          --ink: #dfe8e6;
          --muted: #8b9a97;
          --accent: #86c9c0;
          --accent-soft: #86c9c016;
          --rule: #253330;
          --warn: #d9a55e;
          --warn-soft: #d9a55e16;
          --code-bg: #101917;
          --kw: #c99ad0;
          --str: #7fc4a4;
          --com: #6f807c;
        }
      }
      :root[data-theme="dark"] {
        --paper: #0e1513;
        --surface: #151f1d;
        --ink: #dfe8e6;
        --muted: #8b9a97;
        --accent: #86c9c0;
        --accent-soft: #86c9c016;
        --rule: #253330;
        --warn: #d9a55e;
        --warn-soft: #d9a55e16;
        --code-bg: #101917;
        --kw: #c99ad0;
        --str: #7fc4a4;
        --com: #6f807c;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--body);
        font-size: 17px;
        line-height: 1.6;
        margin: 0;
        padding: 0 1.5rem 6rem;
      }
      .wrap {
        max-width: 42rem;
        margin: 0 auto;
      }
      p,
      li,
      .prose {
        max-width: 38rem;
      }
      .prose {
        margin: 1em 0;
      }

      header {
        padding: 3.5rem 0 2rem;
        border-bottom: 1px solid var(--rule);
        margin-bottom: 2.5rem;
      }
      .eyebrow {
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.9rem;
      }
      .eyebrow a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }
      .eyebrow a:hover {
        border-bottom-color: var(--accent);
      }
      .eyebrow a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      h1 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 2.5rem;
        line-height: 1.12;
        letter-spacing: -0.01em;
        text-wrap: balance;
        margin: 0 0 1.1rem;
      }
      .standfirst {
        font-size: 1.12rem;
        color: var(--muted);
        margin: 0;
        max-width: 34rem;
      }

      h2 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 1.6rem;
        text-wrap: balance;
        margin: 3rem 0 1.25rem;
      }
      h3 {
        font-size: 1rem;
        font-weight: 640;
        margin: 1.75rem 0 0.4rem;
      }

      code {
        font-family: var(--mono);
        font-size: 0.855em;
        background: var(--code-bg);
        padding: 0.12em 0.38em;
        border-radius: 3px;
      }
      pre {
        background: var(--code-bg);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 0.9rem 1rem;
        overflow-x: auto;
        margin: 0.9rem 0;
      }
      pre code {
        background: none;
        padding: 0;
        font-size: 0.78rem;
        line-height: 1.65;
      }
      .tok-com {
        color: var(--com);
      }
      .tok-kw {
        color: var(--kw);
      }
      .tok-str {
        color: var(--str);
      }
      .tok-type {
        color: var(--accent);
      }

      /* Inline vocabulary. The containing paragraph MUST be div.prose — <details> is
     invalid inside <p> and the browser closes the paragraph early, overlapping text. */
      details.term {
        display: inline;
      }
      details.term > summary {
        display: inline;
        cursor: pointer;
        list-style: none;
        border-bottom: 1px dotted var(--accent);
        color: inherit;
      }
      details.term > summary::-webkit-details-marker {
        display: none;
      }
      details.term > summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      details.term > .def {
        display: block;
        margin: 0.6rem 0;
        padding: 0.7rem 0.9rem;
        background: var(--accent-soft);
        border-left: 2px solid var(--accent);
        font-size: 0.9rem;
        color: var(--ink);
      }
      details.term > .def code {
        background: var(--surface);
      }

      /* Numbered sequence, for worked examples */
      .timeline {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 1.4rem;
      }
      .timeline > li {
        display: grid;
        grid-template-columns: 2rem 1fr;
        gap: 1rem;
        align-items: start;
        max-width: none;
      }
      .step {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--muted);
        border: 1px solid var(--rule);
        border-radius: 999px;
        width: 2rem;
        height: 2rem;
        display: grid;
        place-items: center;
        background: var(--surface);
      }
      .timeline .body {
        min-width: 0;
      }
      .timeline .body > :first-child {
        margin-top: 0;
      }
      .timeline .body > :last-child {
        margin-bottom: 0;
      }

      table.data {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
        font-variant-numeric: tabular-nums;
        margin: 1rem 0;
      }
      table.data th {
        text-align: left;
        font-family: var(--mono);
        font-weight: 400;
        font-size: 0.67rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0 0.8rem 0.45rem 0;
        border-bottom: 1px solid var(--rule);
        vertical-align: bottom;
      }
      table.data td {
        padding: 0.5rem 0.8rem 0.5rem 0;
        border-bottom: 1px solid var(--rule);
      }
      table.data td:last-child,
      table.data th:last-child {
        padding-right: 0;
      }
      table.data tr.crux td {
        background: var(--accent-soft);
      }
      .scroller {
        overflow-x: auto;
      }

      .yes {
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.78rem;
      }
      .no {
        color: var(--warn);
        font-family: var(--mono);
        font-size: 0.78rem;
      }
      .tag {
        font-family: var(--mono);
        font-size: 0.63rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.1rem 0.4rem;
        border-radius: 3px;
        white-space: nowrap;
        color: var(--accent);
        background: var(--accent-soft);
        border: 1px solid var(--accent);
      }
      .was,
      .risk {
        font-size: 0.88rem;
        color: var(--warn);
        border-left: 2px solid var(--warn);
        background: var(--warn-soft);
        padding: 0.6rem 0.9rem;
        margin: 0.9rem 0;
        max-width: none;
      }

      details.fold {
        border-top: 1px solid var(--rule);
      }
      details.fold:last-of-type {
        border-bottom: 1px solid var(--rule);
      }
      details.fold > summary {
        cursor: pointer;
        list-style: none;
        display: block;
        padding: 0.85rem 0;
        font-weight: 600;
        font-size: 0.97rem;
      }
      details.fold > summary::-webkit-details-marker {
        display: none;
      }
      details.fold > summary::before {
        content: "＋";
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--accent);
        margin-right: 0.7rem;
      }
      details.fold[open] > summary::before {
        content: "－";
      }
      details.fold > summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      details.fold > .inner {
        padding: 0 0 1.1rem 1.5rem;
      }
      details.fold > .inner > :first-child {
        margin-top: 0;
      }
      details.fold > .inner > :last-child {
        margin-bottom: 0;
      }

      /* A whole section as one fold — Review, and anything else opened rarely */
      details.fold.section {
        margin-top: 3rem;
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
      }
      details.fold.section > summary {
        font-family: var(--display);
        font-weight: 400;
        font-size: 1.6rem;
        padding: 1.4rem 0;
      }
      details.fold.section > summary::before {
        font-size: 1rem;
      }
      details.fold.section > .inner {
        padding-bottom: 0.5rem;
      }
      details.fold.section .fold:first-of-type {
        border-top: 1px solid var(--rule);
      }
      details.fold.section .fold:last-of-type {
        border-bottom: 0;
      }
      .aside {
        font-weight: 400;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        float: right;
        margin-left: 1rem;
      }
      .aside.warn {
        color: var(--warn);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      figure {
        margin: 1.5rem 0 0;
      }
      figure svg {
        width: 100%;
        height: auto;
        display: block;
      }

      .foot {
        margin-top: 3.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--rule);
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        font-variant-numeric: tabular-nums;
      }

      /* Comments layer */
      .cbtn {
        appearance: none;
        border: 1px solid var(--rule);
        background: var(--surface);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.15rem 0.45rem;
        border-radius: 3px;
        cursor: pointer;
        margin-left: 0.6rem;
        vertical-align: middle;
        opacity: 0;
        transition: opacity 0.12s;
      }
      h2:hover .cbtn,
      h3:hover .cbtn,
      summary:hover .cbtn,
      .cbtn:focus-visible,
      .has-comment .cbtn {
        opacity: 1;
      }
      .cbtn:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      @media (hover: none) {
        .cbtn {
          opacity: 1;
        }
      }

      .ccomment {
        border-left: 2px solid var(--warn);
        background: var(--warn-soft);
        padding: 0.7rem 0.9rem;
        margin: 0.8rem 0;
        font-size: 0.9rem;
        max-width: none;
      }
      .ccomment textarea {
        width: 100%;
        font-family: var(--body);
        font-size: 0.9rem;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 4px;
        padding: 0.5rem 0.6rem;
        resize: vertical;
        min-height: 4.5rem;
        line-height: 1.5;
      }
      .ccomment textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .ccomment .row {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
        align-items: center;
      }
      .ccomment button,
      .cbar button {
        appearance: none;
        border: 1px solid var(--rule);
        background: var(--surface);
        color: var(--ink);
        font-family: var(--body);
        font-size: 0.8rem;
        padding: 0.25rem 0.7rem;
        border-radius: 4px;
        cursor: pointer;
      }
      .ccomment button.primary,
      .cbar button.primary {
        border-color: var(--accent);
        color: var(--accent);
      }
      .ccomment button:hover,
      .cbar button:hover {
        border-color: var(--accent);
      }
      .ccomment .saved {
        white-space: pre-wrap;
        margin: 0;
        max-width: none;
      }
      .ccomment .hint {
        color: var(--muted);
        font-size: 0.72rem;
        margin-left: auto;
        font-family: var(--mono);
      }

      .cbar {
        position: fixed;
        right: 1.25rem;
        bottom: 1.25rem;
        z-index: 50;
        display: none;
        gap: 0.5rem;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 0.5rem 0.7rem;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.14);
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted);
      }
      .cbar.on {
        display: flex;
      }
      .cbar button {
        background: transparent;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <p class="eyebrow">EYEBROW — source links, author, state</p>
        <h1>TITLE</h1>
        <p class="standfirst">One sentence. No jargon.</p>
      </header>

      <!-- CONTENT -->

      <div class="foot">
        <span>FOOTER</span>
      </div>
    </div>

    <div class="cbar" id="cbar">
      <span id="ccount">0 comments</span>
      <button class="primary" id="ccopy" type="button">Copy</button>
      <button id="cclear" type="button">Clear</button>
    </div>

    <script>
      (function () {
        var STORE = "comments:" + location.pathname;
        var KEYWORDS =
          /^(case|val|var|def|new|if|else|for|yield|import|match|implicit|true|false|null|this|override|extends|with|sealed|trait|object|class|private|protected|return)$/;

        function escapeHtml(value) {
          return value.replace(/[&<>]/g, function (character) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[
              character
            ];
          });
        }

        document
          .querySelectorAll("pre code")
          .forEach(function (block) {
            var source = block.textContent;
            var pattern =
              /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|([A-Za-z_][A-Za-z0-9_]*)|(\d+)/g;
            var output = "";
            var cursor = 0;
            var match;
            while ((match = pattern.exec(source)) !== null) {
              output += escapeHtml(source.slice(cursor, match.index));
              var token = match[0];
              if (match[1])
                output +=
                  '<span class="tok-com">' +
                  escapeHtml(token) +
                  "</span>";
              else if (match[2])
                output +=
                  '<span class="tok-str">' +
                  escapeHtml(token) +
                  "</span>";
              else if (match[3] && KEYWORDS.test(token))
                output += '<span class="tok-kw">' + token + "</span>";
              else if (match[3] && /^[A-Z]/.test(token))
                output +=
                  '<span class="tok-type">' + token + "</span>";
              else output += escapeHtml(token);
              cursor = match.index + token.length;
            }
            output += escapeHtml(source.slice(cursor));
            block.innerHTML = output;
          });

        var comments = {};
        try {
          comments = JSON.parse(localStorage.getItem(STORE) || "{}");
        } catch (error) {
          comments = {};
        }
        function persist() {
          try {
            localStorage.setItem(STORE, JSON.stringify(comments));
          } catch (error) {
            /* private mode */
          }
        }

        var bar = document.getElementById("cbar");
        var countLabel = document.getElementById("ccount");
        function refreshBar() {
          var total = Object.keys(comments).length;
          countLabel.textContent =
            total === 1 ? "1 comment" : total + " comments";
          bar.classList.toggle("on", total > 0);
        }

        function textOf(element) {
          var copy = element.cloneNode(true);
          copy
            .querySelectorAll(".cbtn, .aside")
            .forEach(function (node) {
              node.remove();
            });
          return copy.textContent.trim().replace(/\s+/g, " ");
        }

        function labelFor(heading) {
          var own = textOf(heading);
          var walker = heading;
          while (walker) {
            walker =
              walker.previousElementSibling || walker.parentElement;
            if (
              walker &&
              (walker.tagName === "H2" ||
                walker.matches?.("details.fold.section"))
            ) {
              var head =
                walker.tagName === "H2"
                  ? walker
                  : walker.querySelector("summary");
              var parent = textOf(head);
              return parent === own ? own : parent + " → " + own;
            }
          }
          return own;
        }

        document
          .querySelectorAll("h2, h3, details.fold > summary")
          .forEach(function (heading, index) {
            var key = "n" + index;
            var host =
              heading.tagName === "SUMMARY"
                ? heading.parentElement
                : heading;
            var panel = null;

            var button = document.createElement("button");
            button.type = "button";
            button.className = "cbtn";
            button.textContent = "comment";
            button.setAttribute("aria-label", "Add a comment here");
            heading.appendChild(button);

            function clear() {
              if (panel) {
                panel.remove();
                panel = null;
              }
            }

            function showSaved() {
              clear();
              var entry = comments[key];
              if (!entry) return;
              panel = document.createElement("div");
              panel.className = "ccomment";
              var saved = document.createElement("p");
              saved.className = "saved";
              saved.textContent = entry.text;
              var row = document.createElement("div");
              row.className = "row";
              var edit = document.createElement("button");
              edit.type = "button";
              edit.textContent = "Edit";
              edit.onclick = function () {
                showEditor(entry.text);
              };
              var remove = document.createElement("button");
              remove.type = "button";
              remove.textContent = "Delete";
              remove.onclick = function () {
                delete comments[key];
                persist();
                refreshBar();
                heading.classList.remove("has-comment");
                clear();
              };
              row.append(edit, remove);
              panel.append(saved, row);
              host.insertAdjacentElement("afterend", panel);
            }

            function showEditor(initial) {
              clear();
              panel = document.createElement("div");
              panel.className = "ccomment";
              var area = document.createElement("textarea");
              area.value = initial || "";
              area.placeholder =
                "What didn't land? What do you want to dig into?";
              var row = document.createElement("div");
              row.className = "row";
              var save = document.createElement("button");
              save.type = "button";
              save.className = "primary";
              save.textContent = "Save";
              var cancel = document.createElement("button");
              cancel.type = "button";
              cancel.textContent = "Cancel";
              var hint = document.createElement("span");
              hint.className = "hint";
              hint.textContent = "⌘⏎ to save";
              save.onclick = function () {
                var value = area.value.trim();
                if (value) {
                  comments[key] = {
                    label: labelFor(heading),
                    text: value,
                    order: index,
                  };
                  heading.classList.add("has-comment");
                } else {
                  delete comments[key];
                  heading.classList.remove("has-comment");
                }
                persist();
                refreshBar();
                showSaved();
              };
              cancel.onclick = showSaved;
              area.addEventListener("keydown", function (event) {
                if (
                  (event.metaKey || event.ctrlKey) &&
                  event.key === "Enter"
                )
                  save.onclick();
                if (event.key === "Escape") cancel.onclick();
              });
              row.append(save, cancel, hint);
              panel.append(area, row);
              host.insertAdjacentElement("afterend", panel);
              area.focus();
            }

            button.addEventListener("click", function (event) {
              event.preventDefault();
              event.stopPropagation();
              showEditor(comments[key] ? comments[key].text : "");
            });

            if (comments[key]) {
              heading.classList.add("has-comment");
              comments[key].label = labelFor(heading);
              comments[key].order = index;
              showSaved();
            }
          });

        document
          .getElementById("ccopy")
          .addEventListener("click", function () {
            var entries = Object.keys(comments)
              .map(function (key) {
                return comments[key];
              })
              .sort(function (left, right) {
                return left.order - right.order;
              });
            var lines = ["Comments on " + document.title + ":", ""];
            entries.forEach(function (entry) {
              lines.push("**" + entry.label + "**");
              lines.push("> " + entry.text.replace(/\n/g, "\n> "));
              lines.push("");
            });
            var payload = lines.join("\n");
            navigator.clipboard.writeText(payload).then(
              function () {
                var button = document.getElementById("ccopy");
                button.textContent = "Copied";
                setTimeout(function () {
                  button.textContent = "Copy";
                }, 1400);
              },
              function () {
                window.prompt("Copy these comments:", payload);
              },
            );
          });

        document
          .getElementById("cclear")
          .addEventListener("click", function () {
            if (!window.confirm("Delete all comments on this page?"))
              return;
            comments = {};
            persist();
            refreshBar();
            document
              .querySelectorAll(".ccomment")
              .forEach(function (node) {
                node.remove();
              });
            document
              .querySelectorAll(".has-comment")
              .forEach(function (node) {
                node.classList.remove("has-comment");
              });
          });

        refreshBar();
      })();
    </script>
  </body>
</html>
