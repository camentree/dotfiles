<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(difit) Review</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f6;
    --card: #ffffff;
    --text: #1d1d20;
    --muted: #74767e;
    --faint: #b4b6bd;
    --line: #dcdce2;
    --field: #f1f1f4;
    --accent: #5b5bd6;
    --failure: #c4372a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0e0e10;
      --card: #19191c;
      --text: #e9e9ec;
      --muted: #8b8d96;
      --faint: #55575f;
      --line: #2d2d33;
      --field: #232327;
      --accent: #8f94f2;
      --failure: #ef8a7b;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--page); color: var(--text); font: 13px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: transparent; border: 0; border-radius: 6px; cursor: pointer; padding: 0; transition: background-color 0.12s, border-color 0.12s, color 0.12s; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .bar { display: flex; justify-content: flex-end; gap: 6px; padding: 3px 8px; background: var(--card); border-bottom: 1px solid var(--line); }
  .small.agent { display: inline-flex; align-items: center; gap: 5px; }
  .small.agent svg { width: 14px; height: 14px; }
  .small { padding: 1px 9px; border: 1px solid var(--line); white-space: nowrap; }
  .small:hover { background: var(--field); border-color: var(--faint); }
  .small:active { transform: translateY(1px); }
  .small.busy, .small.busy:hover, .small.busy:active { color: var(--accent); cursor: progress; background: transparent; border-color: var(--line); transform: none; }
  .small.sent { color: var(--text); font-weight: 600; }
  .small.bad { color: var(--failure); border-color: var(--failure); font-weight: 600; }
  .small.off, .small.off:hover, .small.off:active { color: var(--faint); background: transparent; border-color: var(--line); border-style: dashed; cursor: not-allowed; transform: none; }
  .notice { margin: auto; max-width: 520px; padding: 24px; text-align: center; color: var(--muted); font-size: 14px; }
  .notice b { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }
  iframe { flex: 1; width: 100%; border: 0; background: var(--page); }
</style>
</head>
<body>
<div class="bar"><button class="small agent" id="agent"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2.5" y="5" width="11" height="8" rx="2"/><path d="M8 5V2.5M6 9v1M10 9v1"/></svg><span>agent</span></button></div>
<div class="notice" id="notice" hidden></div>
<iframe id="frame" allow="clipboard-read; clipboard-write" hidden></iframe>

<script src="buttons.js"></script>
<script>
  const query = new URLSearchParams(location.search)
  const id = query.get('id')
  const frame = document.getElementById('frame')
  const notice = document.getElementById('notice')
  const agentButton = document.getElementById('agent')
  const remote = !['localhost', '127.0.0.1'].includes(location.hostname)
  let opening = null

  let state = null
  let unreachable = false
  let port = query.get('port')

  const escape = (text) => String(text ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character])
  const serversOf = (item) => ((item && item.links) || []).filter((link) => link.label.startsWith('difit')).map((link) => ({ port: new URL(link.url).port, label: link.label.replace(/^difit\s*/i, '').trim() })).filter((server, index, all) => all.findIndex((other) => other.port === server.port) === index)
  const firstServer = (item) => (serversOf(item)[0] || {}).port || null
  const tabName = (item) => {
    const servers = serversOf(item)
    const index = servers.findIndex((server) => server.port === port)
    const fromLink = index >= 0 && !/^lan$/i.test(servers[index].label) ? servers[index].label : ''
    return query.get('name') || fromLink || (index >= 0 ? (item.difitLabels || [])[index] || '' : '')
  }
  const tabTitle = (item) => {
    if (!item) return '(difit) Review'
    const name = tabName(item)
    const short = item.title.length > 40 ? `${item.title.slice(0, 39).trim()}…` : item.title
    const servers = serversOf(item)
    const index = servers.findIndex((server) => server.port === port)
    if (name) return `${name} · ${short}`
    if (servers.length > 1 && index >= 0) return `difit ${index + 1} of ${servers.length} · ${short}`
    return `(difit) ${item.title}`
  }

  const showFrame = async () => {
    if (!port) {
      frame.hidden = true
      notice.hidden = false
      notice.innerHTML = '<b>No difit server for this card yet</b>Ask the card\'s agent for one with a note (agent on the card).'
      return
    }
    const address = `http://${location.hostname}:${port}`
    try {
      await fetch(address, { mode: 'no-cors', cache: 'no-store' })
    } catch (error) {
      frame.hidden = true
      frame.removeAttribute('src')
      notice.hidden = false
      notice.innerHTML = `<b>Nothing answers on port ${escape(port)}</b>The difit server for this review is not running, or it moved to another port. Press review on the card and the agent starts it again.`
      return
    }
    notice.hidden = true
    frame.hidden = false
    if (frame.getAttribute('src') !== address) frame.src = address
  }

  const render = () => {
    const item = state ? state.cards[id] : null
    document.title = tabTitle(item)
    renderAgent(item)
  }

  const renderAgent = (item) => {
    const agent = item && item.agent
    const session = agent && (agent.session || agent.sessionId)
    const where = remote ? ` It opens on ${location.hostname}, the machine running the work page, not this device.` : ''
    const off = unreachable ? "can't reach the work page's server" : !session ? 'no agent session for this card' : ''
    const label = agentButton.querySelector('span')
    if (opening && opening.failed) {
      agentButton.className = 'small agent bad'
      label.textContent = 'not opened · retry'
      agentButton.title = `${opening.failed}. Press to try again`
    } else if (opening && opening.done) {
      agentButton.className = 'small agent sent'
      label.textContent = 'opened ✓'
      agentButton.title = `Opened ${session || 'the session'} in Ghostty.${where}`
    } else if (opening) {
      agentButton.className = 'small agent busy'
      label.textContent = 'opening…'
      agentButton.title = 'Asking the work page to open Ghostty'
    } else {
      agentButton.className = `small agent${off ? ' off' : ''}`
      label.textContent = 'agent'
      agentButton.title = off ? `Open this agent's chat in Ghostty. Not available now: ${off}` : `Open this agent's chat in Ghostty: ${session}.${where}`
    }
    agentButton.setAttribute('aria-disabled', String(Boolean(!opening && off) || Boolean(opening && !opening.failed)))
  }

  agentButton.addEventListener('click', async () => {
    if (agentButton.getAttribute('aria-disabled') === 'true') return
    opening = {}
    render()
    try {
      const response = await fetch('/api/terminal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id }), signal: AbortSignal.timeout(30000) })
      const answer = await response.json()
      if (answer.ok) opening.done = true
      else opening.failed = `not opened: ${answer.error || response.status}`
    } catch (error) {
      opening.failed = "no answer from the work page's server: Ghostty may have opened anyway, look before pressing again"
    }
    render()
    if (opening.done) setTimeout(() => { opening = null; render() }, 4000)
  })

  const fetchState = async () => {
    try {
      const response = await fetch('/api/state', { cache: 'no-store' })
      if (!response.ok) throw new Error(`state answered ${response.status}`)
      state = await response.json()
      unreachable = false
    } catch (error) {
      unreachable = true
    }
    render()
  }

  const start = async () => {
    await fetchState()
    if (!port && state && state.cards[id]) port = firstServer(state.cards[id])
    render()
    showFrame()
  }
  start()
  setInterval(fetchState, 5000)
  setInterval(() => { if (frame.hidden) showFrame() }, 5000)
</script>
</body>
</html>
